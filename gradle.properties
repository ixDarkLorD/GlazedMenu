# ─── Gradle ─────────────────────────────────────────────────────────────────────────────────────────────────────────
# Minecraft decompilation needs the memory; the daemon and build cache keep repeated builds fast.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# ─── Build ──────────────────────────────────────────────────────────────────────────────────────────────────────────
# The shared version catalog (net.ixdarklord:sharedcatalogs) and the loaders the mod is built for.
dependencies_catalog_version=1.20.1-v9
project_loaders=forge,fabric
project_game_versions=1.20,1.20.1
# The oldest versions the jars accept (the metadata templates read them).
supported_min_mc_version=1.20
supported_min_fabric_api_version=0.83.0

# ─── Dev Runs ───────────────────────────────────────────────────────────────────────────────────────────────────────
runtime_min_ram=1G
runtime_max_ram=4G
mixin_debug=false

# ─── Glazed Menu ────────────────────────────────────────────────────────────────────────────────────────────────────
# Versions read <minecraft>+<mod version> (build.gradle), e.g. 26.1.2+1.0.
mod_version=1.0
modid=glazedmenu
# Maven artifacts: net.ixdarklord.glazedmenu:<mod_maven_name>-<loader>
mod_maven_name=glazedmenu
mod_name=Glazed Menu
mod_description=A glassy mod list and config screens for every mod: Forge configs, Cloth Config, YACL, MidnightLib and MezzConfig, in place of Mod Menu's and Forge's lists. Needs no other mod.
mod_author=ixDarkLorD
mod_license=MPL-2.0
mod_maven_group=net.ixdarklord
mod_source_url=https://github.com/ixDarkLorD/GlazedMenu
mod_issue_url=https://github.com/ixDarkLorD/GlazedMenu/issues
mod_page_url=https://modrinth.com/mod/glazedmenu
mod_forge_update_url=https://raw.githubusercontent.com/ixDarkLorD/ModResources/refs/heads/main/updates/forge/glazedmenu.json
mod_neoforge_update_url=https://raw.githubusercontent.com/ixDarkLorD/ModResources/refs/heads/main/updates/neoforge/glazedmenu.json
# A client only mod.
mod_environment=client
mod_forge_display_test=IGNORE_ALL_VERSION

# ─── Publishing ─────────────────────────────────────────────────────────────────────────────────────────────────────
project_release_type=release
# true uploads nothing, only shows what would be published
project_upload_debug=false
# Copies each built loader jar to build_jar_output_dir (set in the user's gradle.properties)
copy_build_jar=true
# Modrinth: the glazedmenu project (draft). CurseForge: not created yet, so nothing is uploaded there.
project_curse_id=
project_modrinth_id=jHNhGgr3
# Dependencies of the uploaded files, by CurseForge/Modrinth slug: requirement[a,b],optional[c]
forge_publish_dependencies=requirement[],optional[]
fabric_publish_dependencies=requirement[],optional[]

# ─── Compiled against (never bundled) ───────────────────────────────────────────────────────────────────────────────
# The config libraries Glazed Menu reads, by Modrinth version.
cloth_config_version=11.1.136+fabric
yacl_version=3.6.6+1.20.1-fabric
midnightlib_version=1.9.3+1.20.1-fabric
mezz_config_version=0.6.6
