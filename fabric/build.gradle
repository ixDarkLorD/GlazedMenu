apply from: "https://raw.githubusercontent.com/ixDarkLorD/ModResources/main/gradle/v4/fabric.gradle"

// Uploaded as <minecraft>+<mod version> (the shared scripts would prefix it with "<minecraft>-").
publisher {
    setProjectVersion("${project.version}")
}

// Forge Config API Port's Forge configs (ForgeConfigSpec), read when it's installed; not bundled.
dependencies {
    compileOnly(libs.forgeconfigapiport.fabric) { transitive = false }
    compileOnly "com.electronwill.night-config:core:3.8.3"
}
