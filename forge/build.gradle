apply from: "${rootProject.sharedScripts}/forge.gradle"

// Uploaded as <minecraft>+<mod version> (the shared scripts would prefix it with "<minecraft>-").
publisher {
    setProjectVersion("${project.version}")
    // Forge 47 runs on Minecraft 1.20.1 only.
    gameVersions.set(["1.20.1"])
}

// The optional config libraries common code reads: compile-only here too, so the dev runs' Architectury transformer
// can resolve their classes. Never bundled.
dependencies {
    modCompileOnly("maven.modrinth:cloth-config:${cloth_config_version}") { transitive = false }
    modCompileOnly("maven.modrinth:yacl:${yacl_version}") { transitive = false }
    modCompileOnly("maven.modrinth:midnightlib:${midnightlib_version}") { transitive = false }
    modCompileOnly("net.mezzdev.config:mezz_config-${libs.versions.minecraft.get()}-config-api:${mezz_config_version}") { transitive = false }
    modCompileOnly(libs.forgeconfigapiport.common) { transitive = false }
}
