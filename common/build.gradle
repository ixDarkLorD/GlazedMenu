apply from: "${rootProject.sharedScripts}/common.gradle"

// A plain jar of this module's own classes (Shadow's default bundles the whole runtime classpath).
shadowJar {
    configurations = []
    archiveClassifier = null
}

// The config systems Glazed Menu reads, compiled against but never bundled: each is only touched once its mod is loaded.
// Forge's config API (Forge Config API Port's copies, for common code; the classes Glazed Menu uses are the same as
// Forge's), Cloth Config, YACL, MidnightLib, MezzConfig (their Fabric jars; the classes Glazed Menu uses are the same on Forge).
dependencies {
    modCompileOnly(libs.forgeconfigapiport.common) { transitive = false }
    modCompileOnly(libs.forgeconfigapiport.fabric) { transitive = false }
    compileOnly "com.electronwill.night-config:core:3.8.3"
    modCompileOnly("maven.modrinth:cloth-config:${cloth_config_version}") { transitive = false }
    modCompileOnly("maven.modrinth:yacl:${yacl_version}") { transitive = false }
    modCompileOnly("maven.modrinth:midnightlib:${midnightlib_version}") { transitive = false }
    // MezzConfig (JEI's config library): its API alone.
    modCompileOnly("net.mezzdev.config:mezz_config-${libs.versions.minecraft.get()}-config-api:${mezz_config_version}") { transitive = false }
}
